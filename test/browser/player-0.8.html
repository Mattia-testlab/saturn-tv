<!doctype html><html lang="it"><meta charset="utf-8"><title>Player simulato</title>
<style>html,body{margin:0;height:100%;background:#080c10;color:#eef6ff;font:24px sans-serif}button{position:fixed;inset:0;width:100%;font:inherit;color:inherit;background:transparent;border:0}span{position:fixed;bottom:110px;left:30px;pointer-events:none}</style>
<button id="surface" aria-label="Player simulato">Player simulato · nessun episodio riprodotto</button><span id="state">In attesa della freccia</span>
<div id="jw-player"></div><video hidden></video>
<script>
// Regression model: raw video.play is forbidden; JW owns the state.
let playerState='idle',position=0,playCalls=0;
const video=document.querySelector('video');video.play=()=>{throw Error('Raw play bypasses JW');};
const jw={getState:()=>playerState,getPosition:()=>position,getDuration:()=>600,getControls:()=>true,
play(){playerState='playing';playCalls++;video.dispatchEvent(new Event('playing'));report();},pause(){playerState='paused';video.dispatchEvent(new Event('pause'));},seek(value){position=value;video.dispatchEvent(new Event('timeupdate'));}};
window.jwplayer=()=>jw;
</script><script src="saturn-bridge-test.js"></script><script>
let moves=0,clicks=0;function report(){parent.postMessage({testPlayer:1,ready:!!window.__saturnTV,moves,clicks,plays:playCalls},'http://127.0.0.1:8766');}
document.getElementById('surface').addEventListener('mousemove',()=>{moves++;document.getElementById('state').textContent='Movimento ricevuto · controlli disponibili';report();});
document.getElementById('surface').addEventListener('click',()=>{clicks++;report();});report();
window.addEventListener('message',e=>{if(e.origin==='http://127.0.0.1:8766'&&e.source===parent&&e.data.testKey===13)document.body.dispatchEvent(new KeyboardEvent('keydown',{keyCode:13,bubbles:true,cancelable:true}));});
</script></html>
