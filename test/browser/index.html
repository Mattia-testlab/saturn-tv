<!doctype html><html lang="it"><meta charset="utf-8"><title>Saturn TV 0.9.3 · verifiche</title>
<style>body{background:#101820;color:#eef6ff;font:20px sans-serif}li{padding:6px}button,input{font:inherit;padding:10px}</style>
<h1>Collaudo del modulo classico</h1><input type="search" aria-label="Ricerca di prova"><ul id="results"></ul><script src="saturn-test.js"></script>
<script>
(async()=>{
 const api=window.__saturnTV,results=document.getElementById('results'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
 function check(text,ok){let li=document.createElement('li');li.textContent=(ok?'PASS — ':'FAIL — ')+text;results.appendChild(li);}
 function key(code,type='keydown'){(document.activeElement||document).dispatchEvent(new KeyboardEvent(type,{keyCode:code,bubbles:true,cancelable:true}));}
 check('Versione 0.9.2',api.version==='0.9.2');check('Nessun lettore o barra di riproduzione aggiunti',!document.querySelector('video,#saturn-cinema-controls,#saturn-native-video,#saturn-menu'));
 key(10009);check('Indietro apre la barra completa',document.querySelectorAll('#saturn-toolbar button').length===6);check('Scorciatoie Play e fullscreen presenti',document.querySelector('[data-saturn-action=toggleVideo]')&&document.querySelector('[data-saturn-action=fullscreen]'));
 document.querySelector('[data-saturn-action=settings]').click();check('Preferiti e Riprendi ripristinati',document.querySelector('[data-saturn-action=favorites]')&&document.querySelector('[data-saturn-action=resume]'));
 document.querySelector('[data-saturn-action=tools]').click();check('Strumenti e annulla overlay ripristinati',document.querySelector('[data-saturn-action=undoOverlay]')&&document.querySelector('[data-saturn-action=reload]'));key(10009);check('Indietro dal sottomenu torna alla barra',document.querySelector('#saturn-toolbar').getAttribute('data-view')==='main');
 let focus=document.activeElement;key(39);check('Frecce selezionano i pulsanti della barra',document.activeElement!==focus);
 document.querySelector('[data-saturn-action=search]').click();check('Cerca dà il focus al campo del sito',document.activeElement===document.querySelector('input'));
 key(65376);check('Fine Samsung rilascia la ricerca',document.activeElement!==document.querySelector('input'));
 document.querySelector('input').focus();key(65385);check('Annulla Samsung rilascia la ricerca',document.activeElement!==document.querySelector('input'));
 document.querySelector('input').focus();key(10009);check('Indietro esce dalla ricerca senza aprire la barra',document.activeElement!==document.querySelector('input')&&!document.getElementById('saturn-toolbar'));
 key(10009);key(10009);check('Aprire e chiudere la barra non riapre la tastiera',document.activeElement!==document.querySelector('input'));
 document.querySelector('input').focus();key(13);await sleep(20);check('Invio conserva il comportamento del sito e rilascia il focus',document.activeElement!==document.querySelector('input'));
 function x(){return Number(document.getElementById('saturn-pointer').style.transform.match(/translate3d\(([-.\d]+)/)[1]);}
 let initial=x();key(39);key(39,'keyup');check('Tocco preciso di quattro pixel',x()===initial+4);await sleep(30);
 initial=x();let interrupted=false;const lostFocus=()=>{interrupted=true;};addEventListener('blur',lostFocus);key(39);await sleep(450);key(39,'keyup');removeEventListener('blur',lostFocus);let end=x();check(interrupted?'Perdita focus arresta la corsa (accelerazione verificata nella suite Node)':'Movimento continuo tenendo premuto',interrupted||end>initial+20);await sleep(80);check('Rilascio senza deriva',x()===end);
 key(10009);key(10009);check('La navigazione si richiude',!document.getElementById('saturn-toolbar'));
})();
</script></html>
