<!doctype html><html lang="it"><meta charset="utf-8"><title>Saturn TV 0.9.0 · verifiche</title>
<style>body{background:#101820;color:#eef6ff;font:20px sans-serif}li{padding:6px}button,input{font:inherit;padding:10px}</style>
<h1>Collaudo del modulo classico</h1><input type="search" aria-label="Ricerca di prova"><ul id="results"></ul><script src="saturn-test.js"></script>
<script>
(async()=>{
 const api=window.__saturnTV,results=document.getElementById('results'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
 function check(text,ok){let li=document.createElement('li');li.textContent=(ok?'PASS — ':'FAIL — ')+text;results.appendChild(li);}
 function key(code,type='keydown'){(document.activeElement||document).dispatchEvent(new KeyboardEvent(type,{keyCode:code,bubbles:true,cancelable:true}));}
 check('Versione 0.9.0',api.version==='0.9.0');check('Nessun lettore o barra di riproduzione aggiunti',!document.querySelector('video,#saturn-cinema-controls,#saturn-native-video,#saturn-menu'));
 key(10009);check('Indietro apre solo la navigazione',document.querySelectorAll('#saturn-toolbar button').length===6);check('Nessun Play o fullscreen nel menu',!Array.from(document.querySelectorAll('#saturn-toolbar button')).some(b=>/Play|Pausa|Schermo/i.test(b.textContent)));
 document.querySelector('[data-saturn-action=search]').click();check('Cerca dà il focus al campo del sito',document.activeElement===document.querySelector('input'));
 key(13);await sleep(20);check('Il campo ricerca rilascia il focus',document.activeElement!==document.querySelector('input'));
 function x(){return Number(document.getElementById('saturn-pointer').style.transform.match(/translate3d\(([-.\d]+)/)[1]);}
 let initial=x();key(39);key(39,'keyup');check('Tocco preciso di quattro pixel',x()===initial+4);await sleep(30);
 initial=x();key(39);await sleep(450);key(39,'keyup');let end=x();check('Movimento continuo tenendo premuto',end>initial+35);await sleep(80);check('Rilascio senza deriva',x()===end);
 key(10009);key(10009);check('La navigazione si richiude',!document.getElementById('saturn-toolbar'));
})();
</script></html>
