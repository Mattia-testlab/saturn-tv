<!doctype html><html lang="it"><meta charset="utf-8"><title>Saturn TV — controlli video 0.7.0</title>
<style>body{background:#101820;color:#eef6ff;font:22px sans-serif;margin:30px}iframe{width:80vw;height:60vh;border:0;background:black}button{font:inherit;padding:14px}li{margin:8px}</style>
<h1>Collaudo dei controlli video</h1><p>Player simulato su un’origine separata: verifica movimento, clic e uscita.</p>
<iframe id="watch-iframe" src="http://localhost:8766/player.html" title="Player di collaudo"></iframe>
<ul id="results"></ul><button id="preview">Mostra i comandi a schermo intero</button>
<script src="saturn-bridge-test.js"></script><script>
let ready=false,moves=0,clicks=0;const api=window.__saturnTV,results=document.getElementById('results');
window.addEventListener('message',e=>{if(e.origin==='http://localhost:8766'&&e.data.testPlayer){ready=!!e.data.ready;moves=e.data.moves;clicks=e.data.clicks;if(e.data.plays!==undefined)document.body.dataset.playCalls=e.data.plays;}});
function check(label,ok){const li=document.createElement('li');li.textContent=(ok?'PASS — ':'FAIL — ')+label;results.appendChild(li);}
function key(code){(document.activeElement||document).dispatchEvent(new KeyboardEvent('keydown',{keyCode:code,bubbles:true,cancelable:true}));(document.activeElement||document).dispatchEvent(new KeyboardEvent('keyup',{keyCode:code,bubbles:true}));}
document.getElementById('preview').onclick=()=>api.actions.fullscreen();
(async()=>{
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let i=0;i<40&&!ready;i++)await sleep(50);
 check('Modulo caricato nel player separato',ready);api.actions.fullscreen();await sleep(80);
 key(39);await sleep(80);check('Movimento ricevuto dal player separato',moves>0);
 key(13);await sleep(80);check('OK attiva il pulsante sotto la freccia',clicks===1);
 key(10009);check('Indietro esce dal video e apre il menu',!!document.getElementById('saturn-toolbar')&&!document.getElementById('saturn-cinema-controls'));
 key(10009);api.actions.fullscreen();await sleep(3650);
 check('Controlli nascosti durante la visione',document.getElementById('saturn-cinema-controls').style.opacity==='0');
 key(39);await sleep(80);check('La freccia fa riapparire i controlli',document.getElementById('saturn-cinema-controls').style.opacity==='1');
 key(10009);key(10009);
 api.actions.playVideo();await sleep(150);
 const slider=document.querySelector('#saturn-cinema-controls input');
 check('Play normale mostra durata e barra temporale',!!slider&&!slider.disabled&&Number(slider.max)===600);
 slider.value='240';slider.dispatchEvent(new Event('change',{bubbles:true}));await sleep(150);
 check('La barra temporale sposta il player a quattro minuti',document.querySelector('[data-saturn-time]').textContent.includes('4:00 / 10:00'));
 slider.focus();key(39);await sleep(100);check('Frecce sulla barra spostano di dieci secondi',document.querySelector('[data-saturn-time]').textContent.includes('4:10 / 10:00'));
 key(13);check('OK lascia la barra e libera il cursore',document.activeElement!==slider);
 key(10009);check('Indietro funziona anche dopo aver usato la barra',!!document.getElementById('saturn-toolbar'));key(10009);
 const message={saturnTV:1,type:'status'};document.getElementById('watch-iframe').contentWindow.postMessage(message,'http://localhost:8766');await sleep(100);
 check('I report di stato non ripetono Play',document.body.dataset.playCalls==='1');
 document.body.dataset.done='true';
})();
</script></html>
