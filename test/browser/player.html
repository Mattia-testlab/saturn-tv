<!doctype html><html lang="it"><meta charset="utf-8"><title>Player simulato</title>
<style>html,body{margin:0;height:100%;background:#080c10;color:#eef6ff;font:24px sans-serif}button{position:fixed;inset:0;width:100%;font:inherit;color:inherit;background:transparent;border:0}span{position:fixed;bottom:110px;left:30px;pointer-events:none}</style>
<button id="surface" aria-label="Player simulato">Player simulato · nessun episodio riprodotto</button><span id="state">In attesa della freccia</span>
<script src="saturn-bridge-test.js"></script><script>
let moves=0,clicks=0;function report(){parent.postMessage({testPlayer:1,ready:!!window.__saturnTV,moves,clicks},'http://127.0.0.1:8766');}
document.getElementById('surface').addEventListener('mousemove',()=>{moves++;document.getElementById('state').textContent='Movimento ricevuto · controlli disponibili';report();});
document.getElementById('surface').addEventListener('click',()=>{clicks++;report();});report();
</script></html>
